name: Build and Publish Docker Image (Stage)

on:
  push:
    branches:
      - stage

# id-token must also be granted here: a called workflow can never elevate
# GITHUB_TOKEN permissions beyond what the calling workflow allows.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: stage
    secrets: inherit
